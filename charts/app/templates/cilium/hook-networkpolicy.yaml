{{- if and .Values.postgresExtensionSetup.enabled .Values.ciliumNetworkPolicy.enabled (or .Values.preDeployCommand .Values.preRollbackCommand) -}}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "app.hookName" . }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-1"
    # Keep egress available while the later hook jobs run.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  endpointSelector:
    matchLabels:
      {{- include "app.hookLabelselector" . | nindent 6 }}
  egress:{{ include "app.ciliumEgress" . }}
{{- end }}
