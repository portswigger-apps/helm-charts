{{- if and .Values.global.ingress.enabled (eq .Values.global.ingress.className "traefik") }}
{{- if and .Values.global.ingress.proAuth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-pro-auth
spec:
  forwardAuth:
    address: {{ include "app.proAuthAddress" . }}
    trustForwardHeader: false
    {{- /* For each listed header Traefik deletes the caller's copy from the request
    and copies in auth-burp-forwardauth's value, if it set one. Authorization carries
    the minted JWT, or the caller's own Auth0 token when forwardauth's
    AUTH0_PASS_THROUGH_ENABLED is on; the Portswigger-Ai-* headers are set only then.
    Listing them always means a caller can never send its own marker or account. */}}
    authResponseHeaders:
      - Authorization
      - Portswigger-Ai-Auth-Mode
      - Portswigger-Ai-Credit-Account
      - Portswigger-Ai-License-Allocation-Number
      - Portswigger-Ai-License-Type
      - Portswigger-Ai-Customer-Reference
{{- end }}
{{- end }}