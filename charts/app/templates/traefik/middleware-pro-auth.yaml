{{- if and .Values.global.ingress.enabled (eq .Values.global.ingress.className "traefik") }}
{{- if and .Values.global.ingress.proAuth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-pro-auth
spec:
  forwardAuth:
    address: {{ include "app.proAuthAddress" . }}
    trustForwardHeader: false
    authResponseHeaders:
{{- if eq (int .Values.global.ingress.proAuth.version) 3 }}
      {{- /* v3 mints nothing: leaving Authorization out passes the caller's Auth0
      token through. Listing these makes Traefik drop any copy the caller sent. */}}
      - Portswigger-Ai-Credit-Account
      - Portswigger-Ai-License-Allocation-Number
{{- else }}
      - Authorization
{{- end }}
{{- end }}
{{- end }}