suite: S3Bucket

templates:
  - s3bucket.yaml

tests:
  - it: should not create an S3Bucket by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create an S3Bucket if create is false
    set:
      s3Bucket:
        enabled: true
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should create an S3Bucket if enabled
    set:
      s3Bucket:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: NAMESPACE-RELEASE-NAME
      - equal:
          path: spec.irsaRoleName
          value: NAMESPACE-RELEASE-NAME-irsarole
      - equal:
          path: spec.lifecycleRules
          value:
            - expiration:
                - days: 0
              status: Disabled
              id: rule-0

  - it: should create an s3Bucket with configured values
    set:
      global:
        serviceAccount:
          name: my-cool-service-account
      s3Bucket:
        enabled: true
        lifecycleRules:
          - expiration:
              - days: 50
            filter:
              prefix: prefix-
            status: Enabled
    asserts:
      - equal:
          path: spec.irsaRoleName
          value: my-cool-service-account-irsarole
      - equal:
          path: spec.lifecycleRules
          value:
            - expiration:
                - days: 50
              filter:
                prefix: prefix-
              status: Enabled
              id: rule-0

  - it: should create an S3Bucket with configured lifecycle rule id
    set:
      s3Bucket:
        enabled: true
        lifecycleRules:
          - expiration:
              - days: 50
            filter:
              prefix: prefix-
            status: Enabled
            id: "expire-after-50-days"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.lifecycleRules
          value:
            - expiration:
                - days: 50
              status: Enabled
              filter:
                prefix: prefix-
              id: "expire-after-50-days"

  - it: should create an S3Bucket with many configured lifecycle rules
    set:
      s3Bucket:
        enabled: true
        lifecycleRules:
          - expiration:
              - days: 50
            filter:
              prefix: prefix-
            status: Enabled
          - expiration:
              - days: 10
            filter:
              prefix: preefix-
            status: Enabled
          - expiration:
              - days: 1
            id: "test"
            status: Disabled
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.lifecycleRules
          value:
            - expiration:
                - days: 50
              status: Enabled
              filter:
                prefix: prefix-
              id: "rule-0"
            - expiration:
                - days: 10
              status: Enabled
              filter:
                prefix: preefix-
              id: "rule-1"
            - expiration:
                - days: 1
              id: "test"
              status: Disabled

  - it: should set versioning to false by default
    set:
      s3Bucket:
        enabled: true
    asserts:
      - equal:
          path: spec.versioning
          value: false

  - it: should set versioning to true when versioning is true
    set:
      s3Bucket:
        enabled: true
        versioning: true
    asserts:
      - equal:
          path: spec.versioning
          value: true

  - it: should set replication to false by default
    set:
      s3Bucket:
        enabled: true
    asserts:
      - equal:
          path: spec.replication
          value: false

  - it: should set replication to true when replication and versioning are true
    set:
      s3Bucket:
        enabled: true
        versioning: true
        replication: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.versioning
          value: true
      - equal:
          path: spec.replication
          value: true
      - equal:
          path: spec.replicationRetentionDays
          value: 90

  - it: should set replicationRetentionDays to 90 by default
    set:
      s3Bucket:
        enabled: true
    asserts:
      - equal:
          path: spec.replicationRetentionDays
          value: 90

  - it: should set replicationRetentionDays when overridden
    set:
      s3Bucket:
        enabled: true
        versioning: true
        replication: true
        replicationRetentionDays: 30
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.replication
          value: true
      - equal:
          path: spec.replicationRetentionDays
          value: 30

  - it: should fail when replication is true and versioning is false
    set:
      s3Bucket:
        enabled: true
        versioning: false
        replication: true
    asserts:
      - failedTemplate:
          errorMessage: "s3Bucket.replication requires s3Bucket.versioning: true — S3 replication cannot be enabled on a non-versioned bucket."

  - it: should still render versioning when versioning is true and replication is false
    set:
      s3Bucket:
        enabled: true
        versioning: true
        replication: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.versioning
          value: true
      - equal:
          path: spec.replication
          value: false

  - it: should not set bucketAccessPolicies by default
    set:
      s3Bucket:
        enabled: true
    asserts:
      - isNull:
          path: spec.bucketAccessPolicies

  - it: should set bucketAccessPolicies with a single statement
    set:
      s3Bucket:
        enabled: true
        bucketAccessPolicies:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::999999999999:role/example-role"
            Action:
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - "arn:aws:s3:::my-bucket"
              - "arn:aws:s3:::my-bucket/*"
    asserts:
      - equal:
          path: spec.bucketAccessPolicies
          value:
            - Effect: Allow
              Principal:
                AWS: "arn:aws:iam::999999999999:role/example-role"
              Action:
                - s3:PutObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::my-bucket"
                - "arn:aws:s3:::my-bucket/*"

  - it: should set bucketAccessPolicies with multiple statements
    set:
      s3Bucket:
        enabled: true
        bucketAccessPolicies:
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::999999999999:role/uploader-role"
            Action:
              - s3:PutObject
            Resource:
              - "arn:aws:s3:::my-bucket/*"
          - Effect: Allow
            Principal:
              AWS: "arn:aws:iam::999999999999:role/reader-role"
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - "arn:aws:s3:::my-bucket"
              - "arn:aws:s3:::my-bucket/*"
    asserts:
      - equal:
          path: spec.bucketAccessPolicies[0].Principal.AWS
          value: "arn:aws:iam::999999999999:role/uploader-role"
      - equal:
          path: spec.bucketAccessPolicies[1].Principal.AWS
          value: "arn:aws:iam::999999999999:role/reader-role"
      - equal:
          path: spec.bucketAccessPolicies
          value:
            - Effect: Allow
              Principal:
                AWS: "arn:aws:iam::999999999999:role/uploader-role"
              Action:
                - s3:PutObject
              Resource:
                - "arn:aws:s3:::my-bucket/*"
            - Effect: Allow
              Principal:
                AWS: "arn:aws:iam::999999999999:role/reader-role"
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - "arn:aws:s3:::my-bucket"
                - "arn:aws:s3:::my-bucket/*"

