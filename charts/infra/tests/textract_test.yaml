suite: TextractPolicy

templates:
  - textract.yaml

tests:
  - it: should not create a TextractPolicy by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a TextractPolicy when enabled
    set:
      textract:
        enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: TextractPolicy
      - equal:
          path: metadata.name
          value: NAMESPACE-RELEASE-NAME
      - equal:
          path: spec.irsaRoleName
          value: NAMESPACE-RELEASE-NAME-irsarole

  - it: should create a TextractPolicy with configured values
    set:
      global:
        serviceAccount:
          name: my-cool-service-account
      textract:
        enabled: true
    asserts:
      - equal:
          path: spec.irsaRoleName
          value: my-cool-service-account-irsarole
